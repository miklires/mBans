success:
  banned: "<green><player> was banned. Reason: <gray><reason>"
  banned-temp: "<green><player> was banned for <white><duration></white>. Reason: <gray><reason>"
  unbanned: "<green><player> was unbanned."
  ip-banned: "<green><ip> (<player>) was banned. Reason: <gray><reason>"
  ip-unbanned: "<green>The ban for <ip> was removed."
  muted: "<green><player> was muted. Reason: <gray><reason>"
  muted-temp: "<green><player> was muted for <duration>. Reason: <gray><reason>"
  unmuted: "<green><player> was unmuted."
  kicked: "<green><player> was kicked."
  warned: "<green><player> received a warning (<count>/<max>). Reason: <gray><reason>"
  warn-removed: "<green>Warning removed."
  warns-cleared: "<green>All warnings for <player> were removed."

chat:
  muted: "<red>You cannot use chat.</red>\n<gray>Expires: <white><expires></white></gray>\n<gray>Reason: <white><reason></white></gray>\n<gray>Appeal: <aqua><support_link></aqua>"
  muted-permanent: "<red>You are permanently muted.</red>\n<gray>Reason: <white><reason></white></gray>\n<gray>Appeal: <aqua><support_link></aqua>"

list:
  ban-header: "<gold>Active bans (<count>):"
  ban-entry: "<gray>- <white><player></white> <dark_gray>|</dark_gray> <reason> <dark_gray>|</dark_gray> <expires>"
  history-header: "<gold>History for <white><player></white> (<count>):"
  history-entry: "<gray>#<id> <type> <dark_gray>|</dark_gray> <reason> <dark_gray>|</dark_gray> by <white><issuer></white> <dark_gray>(<date>)"

notify:
  warn-received: "<red>You received a warning.</red>\n<yellow>Reason:</yellow> <white><reason>\n<yellow>Warnings:</yellow> <white><count>/<max>"
  warn-auto-ban: "<red><count> warnings triggered an automatic ban."
  unbanned-notify: "<green>Your ban was removed."
  unmuted-notify: "<green>Your mute was removed."
