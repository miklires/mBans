name: mBans
version: ${version}
main: io.github.miklires.mbans.MBans
api-version: '26.2'
author: miklires
description: Cross-server punishment management for Paper networks
load: STARTUP
folia-supported: true
softdepend: [PlaceholderAPI]
libraries:
  - com.zaxxer:HikariCP:6.2.1
  - com.h2database:h2:2.3.232
  - org.xerial:sqlite-jdbc:3.47.1.0
  - com.mysql:mysql-connector-j:9.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.5.1
  - org.postgresql:postgresql:42.7.5
  - com.maxmind.geoip2:geoip2:5.2.0

permissions:
  mbans.command.ban: {default: op}
  mbans.command.tempban: {default: op}
  mbans.command.unban: {default: op}
  mbans.command.banlist: {default: op}
  mbans.command.banip: {default: op}
  mbans.command.unbanip: {default: op}
  mbans.command.mute: {default: op}
  mbans.command.tempmute: {default: op}
  mbans.command.unmute: {default: op}
  mbans.command.kick: {default: op}
  mbans.command.warn: {default: op}
  mbans.command.unwarn: {default: op}
  mbans.command.history: {default: op}
  mbans.command.check: {default: op}
  mbans.command.staffhistory: {default: op}
  mbans.command.alts: {default: op}
  mbans.command.rollback: {default: op}
  mbans.command.allow: {default: op}
  mbans.command.note: {default: op}
  mbans.command.notes: {default: op}
  mbans.command.stats: {default: op}
  mbans.command.import: {default: op}
  mbans.command.export: {default: op}
  mbans.command.muser: {default: op}
  mbans.view.ip: {default: op}
  mbans.notify.alts: {default: op}
  mbans.override: {default: op}
  mbans.immunity.helper: {default: false}
  mbans.immunity.moderator: {default: false}
  mbans.immunity.admin: {default: false}
  mbans.immunity.owner: {default: false}
  mbans.bypass.ban: {default: false}
  mbans.bypass.mute: {default: false}
  mbans.bypass.kick: {default: false}
  mbans.bypass.warn: {default: false}
  mbans.admin:
    default: op
    children:
      mbans.command.ban: true
      mbans.command.tempban: true
      mbans.command.unban: true
      mbans.command.banlist: true
      mbans.command.banip: true
      mbans.command.unbanip: true
      mbans.command.mute: true
      mbans.command.tempmute: true
      mbans.command.unmute: true
      mbans.command.kick: true
      mbans.command.warn: true
      mbans.command.unwarn: true
      mbans.command.history: true
      mbans.command.check: true
      mbans.command.staffhistory: true
      mbans.command.alts: true
      mbans.command.rollback: true
      mbans.command.allow: true
      mbans.command.note: true
      mbans.command.notes: true
      mbans.command.stats: true
      mbans.command.import: true
      mbans.command.export: true
      mbans.command.muser: true
      mbans.view.ip: true
      mbans.notify.alts: true
      mbans.override: true
