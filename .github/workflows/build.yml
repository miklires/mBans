name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(./gradlew properties -q | awk '/^version:/{print $2}')" >> "$GITHUB_OUTPUT"
      - run: ./gradlew clean build :velocity:build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: mbans-${{ github.sha }}
          path: |
            build/libs/mBans-${{ steps.project.outputs.version }}.jar
            velocity/build/libs/mBans-Velocity-${{ steps.project.outputs.version }}.jar
